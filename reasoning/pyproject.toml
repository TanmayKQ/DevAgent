[project]
name = "devagent-reasoning"
version = "0.1.0"
description = "DevAgent reasoning loop: LangGraph-based planning and tool-calling agent"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.21",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
